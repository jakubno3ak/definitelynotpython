name: CI

on: [push, pull_request]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: pip install clang-format==21.1.8  # same version as local, versions format differently
      - name: Check formatting
        run: make format-check

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # keep running the other variants when one fails
      matrix:
        include:
          - name: release
            flags: ""
          - name: debug + sanitizers
            flags: MODE=debug
          - name: no BLAS
            flags: BLAS=0
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: models
          key: models-stories15M-v1

      - name: Download model
        run: make model

      - name: Tests
        run: make ${{ matrix.flags }} test
